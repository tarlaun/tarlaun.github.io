<!-- Support for MatJax -->

<!-- Support for Mermaid -->
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({startOnLoad:true, theme:'default'});
    await mermaid.run({querySelector:'code.language-mermaid'});
</script>

<!-- Floral theme: butterflies fluttering across the page -->
<div class="fl-flutter" aria-hidden="true">
  {% for n in (1..3) %}
  <span class="bfly bfly--{{ n }}">
    <svg class="bfly__svg" viewBox="0 0 36 30">
      <g class="wing wing-l"><ellipse cx="11" cy="11" rx="9.5" ry="7.5"/><ellipse cx="12.5" cy="21" rx="6.5" ry="5.5"/></g>
      <g class="wing wing-r"><ellipse cx="25" cy="11" rx="9.5" ry="7.5"/><ellipse cx="23.5" cy="21" rx="6.5" ry="5.5"/></g>
      <line class="bfly__body" x1="18" y1="6" x2="18" y2="25"/>
      <path class="bfly__ant" d="M18 6 C 16 2 14 1.5 13 1 M18 6 C 20 2 22 1.5 23 1" fill="none"/>
    </svg>
  </span>
  {% endfor %}
</div>

<!-- Floral theme: fireflies (night) -->
<div class="fl-fireflies" aria-hidden="true">
  {% for n in (1..7) %}<span class="firefly"></span>{% endfor %}
</div>

<!-- Floral theme: enchant on/off toggle -->
<button id="enchant-toggle" class="enchant-toggle" type="button" aria-label="Toggle magical effects" aria-pressed="true" title="Turn off magic">🪄</button>

<!-- Floral theme: fairy-dust sparkles, click-burst & enchant control -->
<script>
(function () {
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var body = document.body;

  // restore saved enchant preference
  if (localStorage.getItem('enchant') === 'off') body.classList.add('no-enchant');
  var btn = document.getElementById('enchant-toggle');
  function syncBtn() {
    var off = body.classList.contains('no-enchant');
    if (btn) { btn.setAttribute('aria-pressed', String(!off)); btn.title = off ? 'Turn on magic' : 'Turn off magic'; }
  }
  syncBtn();
  if (btn) btn.addEventListener('click', function () {
    var off = body.classList.toggle('no-enchant');
    localStorage.setItem('enchant', off ? 'off' : 'on');
    syncBtn();
  });

  function enchanted() { return !reduce && !body.classList.contains('no-enchant'); }

  var colors = ['#f6c945', '#ffe9a3', '#c4a6e0', '#e0a0b8', '#9cc08f'];
  function spark(x, y, spread) {
    var s = document.createElement('span');
    s.className = 'fairy-dust';
    var sz = 6 + Math.random() * 9;
    var c = colors[(Math.random() * colors.length) | 0];
    var ang = Math.random() * Math.PI * 2;
    var dist = spread * (0.35 + Math.random() * 0.85);
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.width = s.style.height = sz + 'px';
    s.style.background = c;
    s.style.color = c;
    s.style.setProperty('--dx', (Math.cos(ang) * dist) + 'px');
    s.style.setProperty('--dy', (Math.sin(ang) * dist - 8) + 'px');
    s.style.setProperty('--rot', ((Math.random() * 180 - 90) | 0) + 'deg');
    body.appendChild(s);
    setTimeout(function () { s.remove(); }, 900);
  }

  // fairy-dust trail while hovering links / buttons
  var last = 0;
  document.addEventListener('mousemove', function (e) {
    if (!enchanted()) return;
    var t = e.target && e.target.closest && e.target.closest('a, button, [role="button"], .btn');
    if (!t) return;
    var now = Date.now();
    if (now - last < 45) return;
    last = now;
    spark(e.clientX, e.clientY, 24);
    if (Math.random() < 0.5) spark(e.clientX + (Math.random() * 10 - 5), e.clientY + (Math.random() * 10 - 5), 24);
  });

  // sparkle burst on click anywhere (the wand casting a spell)
  document.addEventListener('click', function (e) {
    if (!enchanted()) return;
    if (e.target.closest && e.target.closest('#enchant-toggle')) return;
    var n = 14 + (Math.random() * 6 | 0);
    for (var i = 0; i < n; i++) spark(e.clientX, e.clientY, 62);
  });
})();
</script>
